<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>强风吹拂人格测试｜游音视域</title>
  <meta name="description" content="测测你更像竹青庄里的哪一种奔跑灵魂，领取你的强风吹拂人格。" />
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GCNQEEZ8MY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-GCNQEEZ8MY");
  </script>
  <!-- QRCode.js：用于在结果卡里生成“扫码打开测试”的二维码 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f5faf4;
      --card: #ffffff;
      --text: #17251d;
      --muted: #607064;
      --line: #d8eadb;
      --soft: #edf6ee;
      --green: #4d7058;
      --shadow: 0 8px 24px rgba(23, 37, 29, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 16px 36px;
    }

    .page.home {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .home-card { padding: 24px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    h1, h2, h3, p { margin: 0; }

    .home-title {
      font-size: 38px;
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-weight: 950;
    }

    .home-subtitle {
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.75;
      color: var(--muted);
    }

    .info-box {
      margin-top: 28px;
      padding: 16px;
      border-radius: 24px;
      background: var(--bg);
    }

    .info-box-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--green);
    }

    .info-box-text {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .primary-btn {
      width: 100%;
      min-height: 56px;
      margin-top: 28px;
      border-radius: 24px;
      background: var(--text);
      color: #fff;
      font-size: 18px;
      font-weight: 950;
      box-shadow: 0 12px 28px rgba(23, 37, 29, 0.16);
    }

    .primary-btn:active, .secondary-btn:active, .option-btn:active { transform: scale(0.99); }

    details.about {
      margin-top: 18px;
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    details.about summary {
      font-size: 14px;
      font-weight: 900;
    }

    details.about p {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -16px -16px 16px;
      padding: 12px 16px 14px;
      background: rgba(245, 250, 244, 0.94);
      backdrop-filter: blur(12px);
    }

    .topbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .plain-btn {
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      padding: 6px 0;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 950;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--line);
    }

    .progress-inner {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .question-card {
      padding: 20px;
      border-radius: 30px;
    }

    .question-index {
      font-size: 14px;
      font-weight: 900;
      color: var(--green);
    }

    .question-title {
      margin-top: 12px;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .option-btn {
      width: 100%;
      min-height: 64px;
      padding: 16px;
      text-align: left;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 16px;
      font-weight: 850;
      line-height: 1.65;
    }

    .option-btn.selected {
      border-color: var(--green);
      background: var(--soft);
    }

    .letter {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      margin-right: 10px;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 950;
      vertical-align: 1px;
    }

    .nav-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .secondary-btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 950;
    }

    .submit-btn {
      flex: 1;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 16px;
      background: var(--text);
      color: #fff;
      font-size: 14px;
      font-weight: 950;
    }

    .submit-hint {
      flex: 1;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: right;
    }

    .result-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -16px -16px 16px;
      padding: 12px 16px;
      background: rgba(245, 250, 244, 0.94);
      backdrop-filter: blur(12px);
    }

    .result-topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-btn, .more-btn {
      background: transparent;
      color: var(--muted);
      font-size: 28px;
      line-height: 1;
      padding: 4px 6px;
    }

    .result-top-title {
      text-align: center;
      font-size: 14px;
      font-weight: 950;
    }

    .result-top-subtitle {
      margin-top: 2px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .image-card {
      padding: 14px;
      border-radius: 30px;
      overflow: hidden;
    }

    .hero-image-wrap {
      position: relative;
      height: 520px;
      overflow: hidden;
      border-radius: 24px;
      background: var(--result-color, #8bb7d9);
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .image-fallback {
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      color: #fff;
    }

    .image-fallback-name {
      font-size: 48px;
      font-weight: 950;
      line-height: 1.05;
    }

    .image-fallback-tip {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .quote-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 80px 20px 20px;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
    }

    .quote-overlay p {
      font-size: 20px;
      line-height: 1.45;
      font-weight: 950;
    }

    .result-card {
      margin-top: 18px;
      padding: 20px;
      border-radius: 24px;
    }

    .section-label {
      color: #6a7d70;
      font-size: 14px;
      font-weight: 900;
    }

    .result-name {
      margin-top: 12px;
      font-size: 31px;
      line-height: 1.2;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .match-pill {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 18px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 18px;
      font-weight: 950;
    }

    .result-summary {
      margin-top: 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .section-title {
      font-size: 20px;
      font-weight: 950;
    }

    .body-text {
      margin-top: 14px;
      color: #435349;
      font-size: 16px;
      line-height: 1.9;
    }

    .sign-title {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 900;
      color: var(--green);
    }

    .sign-quote {
      margin-top: 10px;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 950;
    }

    .good-bad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .good-bad-item {
      padding: 12px;
      border-radius: 18px;
      background: var(--bg);
      font-size: 13px;
      line-height: 1.6;
    }

    .good-bad-label {
      margin-bottom: 4px;
      color: var(--green);
      font-weight: 950;
    }

    .dimensions {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .dimension-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 900;
    }

    .bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
    }

    .bar-inner {
      height: 100%;
      background: var(--green);
      border-radius: 999px;
    }

    .action-stack {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .group-btn {
      width: 100%;
      min-height: 56px;
      border-radius: 24px;
      background: var(--soft);
      color: var(--green);
      font-size: 16px;
      font-weight: 950;
    }

    .small-note {
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .hidden-share-qr {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 112px;
      height: 112px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
    }

    .hidden-share-qr canvas,
    .hidden-share-qr img {
      width: 112px !important;
      height: 112px !important;
      display: block;
    }

    .share-btn {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0, 0, 0, 0.58);
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      border-radius: 28px;
      background: #fff;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22);
      text-align: center;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 950;
      color: var(--text);
    }

    .modal-desc {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    .qr-box {
      margin: 18px auto 0;
      width: 240px;
      height: 240px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 10px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .qr-fallback {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      background: #fff;
    }

    .modal-tip {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .modal-close {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      border-radius: 18px;
      background: var(--text);
      color: #fff;
      font-weight: 950;
    }



    .omamori-modal-card {
      text-align: left;
      max-height: 86vh;
      overflow: auto;
    }

    .modal-eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
      margin-bottom: 12px;
    }

    .omamori-sign-card {
      margin-top: 16px;
      padding: 16px;
      border-radius: 22px;
      background: var(--bg);
      border: 1px solid var(--line);
    }

    .omamori-sign-title {
      color: var(--green);
      font-size: 13px;
      font-weight: 950;
    }

    .omamori-sign-quote {
      margin-top: 10px;
      color: var(--text);
      font-size: 22px;
      line-height: 1.42;
      font-weight: 950;
    }

    .omamori-sign-text {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .goods-preview {
      margin: 16px auto 0;
      width: 100%;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bg);
      border: 1px solid var(--line);
    }

    .goods-preview + .goods-preview {
      margin-top: 12px;
    }

    .goods-preview img {
      width: 100%;
      height: auto;
      max-height: 360px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .goods-fallback {
      min-height: 160px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      background: #fff;
    }

    .omamori-reason {
      display: grid;
      gap: 6px;
      margin-top: 14px;
      padding: 14px;
      border-radius: 18px;
      background: #fff7e8;
      color: #6f4b17;
      font-size: 13px;
      line-height: 1.55;
    }

    .modal-primary-action,
    .modal-secondary-action {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      border-radius: 18px;
      font-weight: 950;
    }

    .modal-primary-action {
      background: var(--text);
      color: #fff;
    }

    .modal-secondary-action {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .hidden { display: none !important; }

    @media (max-width: 360px) {
      .home-title { font-size: 34px; }
      .result-name { font-size: 27px; }
      .hero-image-wrap { height: 470px; }
    }
  </style>
</head>
<body>
  <div id="homePage" class="page home">
    <div class="card home-card">
      <div class="badge">游音视域｜把喜欢，系在身边</div>
      <h1 class="home-title">强风吹拂人格测试</h1>
      <p class="home-subtitle">测测你更像竹青庄里的哪一种奔跑灵魂。</p>

      <div class="info-box">
        <p class="info-box-title">测试说明</p>
        <p class="info-box-text">共 24 题。凭第一感觉选择即可。完成后会得到你的强风吹拂角色人格、匹配度和一支专属奔跑御签。结果仅保留：灰二、阿走、王子、神童、阿雪、尼古。</p>
      </div>

      <button id="startBtn" class="primary-btn">开始测试</button>
    </div>

    <details class="about">
      <summary>关于游音视域</summary>
      <p>我们是为动漫、游戏、音乐爱好者服务的情绪礼物品牌，把喜欢，系在身边。</p>
    </details>
  </div>

  <div id="testPage" class="page hidden">
    <div class="topbar">
      <div class="topbar-row">
        <button id="backHomeBtn" class="plain-btn">返回</button>
        <div id="progressText" class="progress-text">1 / 24</div>
        <div style="width: 36px;"></div>
      </div>
      <div class="progress"><div id="progressInner" class="progress-inner"></div></div>
    </div>

    <div class="card question-card">
      <div id="questionIndex" class="question-index">第 1 题</div>
      <h1 id="questionTitle" class="question-title"></h1>
      <div id="options" class="options"></div>
    </div>

    <div class="nav-row">
      <button id="prevBtn" class="secondary-btn">上一题</button>
      <button id="submitBtn" class="submit-btn hidden">查看结果</button>
      <div id="submitHint" class="submit-hint">全选完后查看结果</div>
    </div>
  </div>

  <div id="resultPage" class="page hidden">
    <div class="result-topbar">
      <div class="result-topbar-inner">
        <button id="closeResultBtn" class="close-btn">×</button>
        <div>
          <div class="result-top-title">强风吹拂人格测试</div>
          <div class="result-top-subtitle">游音视域</div>
        </div>
        <button class="more-btn">⋯</button>
      </div>
    </div>

    <div id="resultShareArea">
      <div class="card image-card">
        <div id="heroWrap" class="hero-image-wrap">
          <img id="heroImage" class="hero-image" alt="角色图" />
          <div id="imageFallback" class="image-fallback">
            <div id="imageFallbackName" class="image-fallback-name"></div>
            <div class="image-fallback-tip">角色图资源待配置</div>
          </div>
          <div class="quote-overlay"><p id="heroQuote"></p></div>
        </div>
      </div>

      <div class="card result-card">
        <p class="section-label">你的主类型</p>
        <h1 id="resultName" class="result-name"></h1>
        <div id="matchPill" class="match-pill"></div>
        <p id="resultSummary" class="result-summary"></p>
      </div>

      <div class="card result-card">
        <h2 class="section-title">简单解读</h2>
        <p id="resultLongText" class="body-text"></p>
      </div>

      <div class="card result-card">
        <h2 class="section-title">你的御签</h2>
        <p id="signTitle" class="sign-title"></p>
        <p id="signQuote" class="sign-quote"></p>
        <p id="signText" class="body-text"></p>
        <div class="good-bad-grid">
          <div class="good-bad-item">
            <div class="good-bad-label">今日宜</div>
            <div id="signGood"></div>
          </div>
          <div class="good-bad-item">
            <div class="good-bad-label">今日忌</div>
            <div id="signBad"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card result-card">
      <h2 class="section-title">六维度评分</h2>
      <div id="dimensions" class="dimensions"></div>
    </div>

    <div id="pageQr" class="hidden-share-qr" aria-hidden="true"></div>

    <div class="action-stack">
      <button id="downloadBtn" class="primary-btn" style="margin-top: 0;">下载结果卡</button>
      <p id="downloadStatus" class="status"></p>
      <button id="shareBtn" class="group-btn share-btn">转发给朋友</button>
      <p id="shareStatus" class="status"></p>
      <button id="groupBtn" class="group-btn">查看我的人格对应御守</button>
      <p class="small-note">不是普通周边，是把那阵风陪你跑过的心情，系在身边。</p>
      <button id="restartBtn" class="secondary-btn" style="width: 100%; min-height: 56px; border-radius: 24px;">重新测试</button>
    </div>
  </div>

  <div id="groupModal" class="modal-mask hidden">
    <div class="modal-card omamori-modal-card">
      <div class="modal-eyebrow">强风吹拂同人御守实拍</div>
      <div id="modalResultName" class="modal-title">查看实拍图</div>

      <div class="omamori-sign-card">
        <div id="modalCopyTitle" class="omamori-sign-title"></div>
        <div id="modalCopyDesc" class="omamori-sign-text"></div>
      </div>

      <div id="goodsPreviewList"></div>

      <button id="buyWayBtn" class="modal-primary-action">查看实拍和购买方式</button>
      <button id="closeGroupModalBtn" class="modal-close">暂时先不看</button>
    </div>
  </div>

  <script>

    function calcResult() {
      const groupCount = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
      const groupMap = {
        A: "haiji",
        B: "kakeru",
        C: "prince",
        D: "shindo",
        E: "yuki",
        F: "nico",
      };
      const dims = Object.fromEntries(DIMENSIONS.map((d) => [d.key, 0]));

      state.answers.forEach((answerIndex, questionIndex) => {
        if (answerIndex === null || answerIndex === undefined) return;
        const option = QUESTIONS[questionIndex].options[answerIndex];
        groupCount[option.group] += 1;
        Object.entries(option.dim || {}).forEach(([key, value]) => {
          dims[key] = (dims[key] || 0) + value;
        });
      });

      const sortedGroups = Object.entries(groupCount).sort((a, b) => b[1] - a[1]);
      const topGroup = sortedGroups[0][0];
      const topCount = sortedGroups[0][1];

      const typeId = groupMap[topGroup] || "haiji";

      const match = Math.min(96, Math.max(72, Math.round(68 + (topCount / QUESTIONS.length) * 30 + Math.random() * 4)));
      const maxDim = Math.max(...Object.values(dims), 1);
      const normDims = Object.fromEntries(DIMENSIONS.map((d) => [d.key, Math.round(((dims[d.key] || 0) / maxDim) * 100)]));

      return { type: TYPES[typeId], match, groupCount, dims: normDims };
    }

    const CANVAS_FONT = '"PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif';

    function setCanvasFont(ctx, weight, size) {
      ctx.font = `${weight} ${size}px ${CANVAS_FONT}`;
      ctx.textBaseline = "alphabetic";
    }

    function fitTextWithEllipsis(ctx, text, maxWidth) {
      let result = String(text);
      if (ctx.measureText(result).width <= maxWidth) return result;
      while (result.length > 0 && ctx.measureText(result + "…").width > maxWidth) {
        result = result.slice(0, -1);
      }
      return result + "…";
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 99) {
      const chars = String(text).split("");
      let line = "";
      let lines = 0;

      for (let i = 0; i < chars.length; i += 1) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines += 1;
          if (lines >= maxLines) {
            const remaining = chars.slice(i).join("");
            ctx.fillText(fitTextWithEllipsis(ctx, line + remaining, maxWidth), x, y);
            return y + lineHeight;
          }
          ctx.fillText(line, x, y);
          y += lineHeight;
          line = chars[i];
        } else {
          line = testLine;
        }
      }

      if (line && lines < maxLines) {
        ctx.fillText(line, x, y);
        y += lineHeight;
      }
      return y;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function isSameOriginOrRelative(src) {
      try {
        const url = new URL(src, window.location.href);
        return url.origin === window.location.origin;
      } catch (e) {
        return true;
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        // 关键修复：同源/相对路径图片不要设置 crossOrigin。
        // 否则部分服务器没有返回 CORS 头时，图片页面能显示，但 Canvas 会加载失败。
        // 如果你用外链图片，下载结果卡可能仍然失败，最好把图片放到本站 assets 目录。
        if (!isSameOriginOrRelative(src)) img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function drawCoverImage(ctx, img, x, y, w, h, fit = "cover", position = "center") {
      const ratio = fit === "contain" ? Math.min(w / img.width, h / img.height) : Math.max(w / img.width, h / img.height);
      const iw = img.width * ratio;
      const ih = img.height * ratio;
      const dx = x + (w - iw) / 2;
      const dy = position === "top" ? y : y + (h - ih) / 2;
      ctx.drawImage(img, dx, dy, iw, ih);
    }

    function drawImageFallback(ctx, r, x, y, w, h) {
      ctx.fillStyle = r.color;
      roundRect(ctx, x, y, w, h, 32);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      setCanvasFont(ctx, 800, 60);
      ctx.fillText(r.shortName, x + 58, y + h * 0.42);
      setCanvasFont(ctx, 500, 30);
      ctx.fillText("角色图资源待配置", x + 58, y + h * 0.42 + 54);
    }

    function createCardCanvas(result, options = { includeImage: true }) {
      const r = result.type;
      const canvas = document.createElement("canvas");
      const width = 900;
      // 结果卡顶部图片区域保持和页面结果页一致的比例：
      // 页面 CSS 中 .hero-image-wrap 宽约 370px，高 520px，object-position 为 top center。
      // 这样只需要维护一套角色图，不会出现网页里正常、下载卡里裁切不同的问题。
      const height = 2080;
      const scale = 2;
      canvas.width = width * scale;
      canvas.height = height * scale;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      const imgX = 86;
      const imgY = 86;
      const imgW = 728;
      const imgH = Math.round(imgW * 520 / 370);

      function drawBase() {
        ctx.fillStyle = "#f5faf4";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#ffffff";
        roundRect(ctx, 48, 48, 804, height - 96, 42);
        ctx.fill();
        ctx.strokeStyle = "#d8eadb";
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      function drawTextBlocks() {
        const grad = ctx.createLinearGradient(0, imgY + imgH - 240, 0, imgY + imgH);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(1, "rgba(0,0,0,0.74)");
        ctx.save();
        roundRect(ctx, imgX, imgY, imgW, imgH, 34);
        ctx.clip();
        ctx.fillStyle = grad;
        ctx.fillRect(imgX, imgY + imgH - 270, imgW, 270);
        ctx.fillStyle = "#ffffff";
        setCanvasFont(ctx, 800, 38);
        wrapText(ctx, r.quote, imgX + 44, imgY + imgH - 158, imgW - 88, 50, 3);
        ctx.restore();

        // 主类型卡片：加高卡片，并让“匹配度”跟随角色名换行后的实际高度。
        const typeCardY = imgY + imgH + 40;
        const typeCardH = 250;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, 86, typeCardY, 728, typeCardH, 30);
        ctx.fill();
        ctx.strokeStyle = "#d8eadb";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#6a7d70";
        setCanvasFont(ctx, 700, 27);
        ctx.fillText("你的主类型", 126, typeCardY + 62);

        ctx.fillStyle = "#17251d";
        setCanvasFont(ctx, 800, 46);
        const afterNameY = wrapText(ctx, r.displayName, 126, typeCardY + 132, 650, 56, 2);

        const pillX = 126;
        const pillY = Math.min(afterNameY + 4, typeCardY + typeCardH - 68);
        const pillW = 206;
        const pillH = 58;
        ctx.fillStyle = "#e9f5eb";
        roundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2);
        ctx.fill();
        ctx.fillStyle = "#4d7058";
        setCanvasFont(ctx, 800, 28);
        ctx.fillText(`匹配度 ${result.match}%`, pillX + 24, pillY + 38);

        // 解读卡片。
        const descY = typeCardY + typeCardH + 34;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, 86, descY, 728, 284, 30);
        ctx.fill();
        ctx.strokeStyle = "#d8eadb";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#17251d";
        setCanvasFont(ctx, 800, 31);
        ctx.fillText("该人格的简单解读", 126, descY + 66);
        ctx.fillStyle = "#435349";
        setCanvasFont(ctx, 500, 27);
        wrapText(ctx, r.summary, 126, descY + 126, 650, 43, 5);

        const shareY = descY + 284 + 36;
        const shareH = 200;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, 86, shareY, 728, shareH, 30);
        ctx.fill();
        ctx.strokeStyle = "#d8eadb";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#17251d";
        setCanvasFont(ctx, 800, 31);
        ctx.fillText("扫码打开测试", 126, shareY + 62);

        ctx.fillStyle = "#435349";
        setCanvasFont(ctx, 500, 25);
        wrapText(ctx, "扫码就能直接测自己的强风吹拂人格哦~", 126, shareY + 112, 430, 40, 2);

        const qrX = 630;
        const qrY = shareY + 32;
        const qrSize = 136;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, qrX - 12, qrY - 12, qrSize + 24, qrSize + 24, 22);
        ctx.fill();
        ctx.strokeStyle = "#d8eadb";
        ctx.lineWidth = 2;
        ctx.stroke();

        const qrSource = getQrCanvasForResultCard();
        if (qrSource) {
          ctx.drawImage(qrSource, qrX, qrY, qrSize, qrSize);
        } else {
          ctx.fillStyle = "#6a7d70";
          setCanvasFont(ctx, 700, 20);
          wrapText(ctx, "扫码打开\n测试", qrX + 18, qrY + 62, qrSize - 36, 28, 2);
        }

        ctx.fillStyle = "#6a7d70";
        setCanvasFont(ctx, 500, 23);
        ctx.fillText(`${CONFIG.brand}｜${CONFIG.slogan}`, 126, height - 72);
      }

      drawBase();

      ctx.save();
      roundRect(ctx, imgX, imgY, imgW, imgH, 34);
      ctx.clip();
      ctx.fillStyle = r.color;
      ctx.fillRect(imgX, imgY, imgW, imgH);
      ctx.restore();

      if (!options.includeImage) {
        drawImageFallback(ctx, r, imgX, imgY, imgW, imgH);
      }

      return { canvas, ctx, imgX, imgY, imgW, imgH, drawTextBlocks, r };
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        if (!canvas.toBlob) {
          try {
            const dataUrl = canvas.toDataURL("image/png");
            resolve(dataURLToBlob(dataUrl));
          } catch (e) {
            reject(e);
          }
          return;
        }
        try {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("canvas.toBlob 返回空结果"));
          }, "image/png", 0.95);
        } catch (e) {
          reject(e);
        }
      });
    }

    function dataURLToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const mime = parts[0].match(/:(.*?);/)[1];
      const binary = atob(parts[1]);
      const len = binary.length;
      const array = new Uint8Array(len);
      for (let i = 0; i < len; i += 1) array[i] = binary.charCodeAt(i);
      return new Blob([array], { type: mime });
    }

    async function downloadCanvas(canvas, filename) {
      const blob = await canvasToBlob(canvas);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function downloadResultCard() {
      const result = state.result || calcResult();
      const r = result.type;
      const filename = `强风吹拂人格测试-${r.shortName}.png`;
      $("downloadStatus").textContent = "正在生成结果卡…";

      // 关键修复：Canvas 一旦被跨域图片污染，clearRect 后仍然无法导出。
      // 所以如果第一次导出失败，必须创建一个全新的 Canvas，生成无角色图版本。
      try {
        const card = createCardCanvas(result, { includeImage: true });
        let imageDrawn = false;

        try {
          const img = await loadImage(r.image);
          card.ctx.save();
          roundRect(card.ctx, card.imgX, card.imgY, card.imgW, card.imgH, 34);
          card.ctx.clip();
          drawCoverImage(card.ctx, img, card.imgX, card.imgY, card.imgW, card.imgH, "cover", "top");
          card.ctx.restore();
          imageDrawn = true;
        } catch (e) {
          imageDrawn = false;
        }

        if (!imageDrawn) {
          drawImageFallback(card.ctx, r, card.imgX, card.imgY, card.imgW, card.imgH);
        }

        card.drawTextBlocks();
        await downloadCanvas(card.canvas, filename);
        $("downloadStatus").textContent = "结果卡已生成，底部二维码可扫码打开测试。如果浏览器没有自动下载，请长按图片保存。";
      } catch (err) {
        console.error("带图结果卡生成失败：", err);
        try {
          const safeCard = createCardCanvas(result, { includeImage: false });
          safeCard.drawTextBlocks();
          await downloadCanvas(safeCard.canvas, filename);
          $("downloadStatus").textContent = "带图版本生成失败，已生成无角色图版本。请检查图片路径或服务器 MIME 类型。";
        } catch (fallbackErr) {
          console.error("无图结果卡生成失败：", fallbackErr);
          const msg = fallbackErr && fallbackErr.message ? fallbackErr.message : String(fallbackErr);
          $("downloadStatus").textContent = `生成失败：${msg}。请先截图保存当前结果页。`;
        }
      }
    }

    $("startBtn").addEventListener("click", () => {
      renderQuestion();
      show("testPage");
    });

    $("backHomeBtn").addEventListener("click", reset);

    $("prevBtn").addEventListener("click", () => {
      state.index = Math.max(0, state.index - 1);
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $("submitBtn").addEventListener("click", renderResult);
    $("closeResultBtn").addEventListener("click", reset);
    $("restartBtn").addEventListener("click", reset);
    $("downloadBtn").addEventListener("click", () => {
      trackAnalyticsEvent("download_result_card_click", {
        button_name: "download_result_card",
        button_text: $("downloadBtn").textContent.trim(),
        ...getResultAnalyticsParams(),
      });
      downloadResultCard();
    });
    $("shareBtn").addEventListener("click", shareTest);

    $("groupBtn").addEventListener("click", () => {
      trackAnalyticsEvent("kaze_omamori_click", {
        button_name: "result_second_button",
        button_text: $("groupBtn").textContent.trim(),
        result_id: state.result?.type?.id || "unknown",
        result_type: state.result?.type?.shortName || "unknown",
        result_name: state.result?.type?.displayName || "unknown",
        match: state.result?.match || 0,
      });

      renderOmamoriModal();
    });

    $("buyWayBtn").addEventListener("click", goBuyWay);

    $("closeGroupModalBtn").addEventListener("click", () => {
      $("groupModal").classList.add("hidden");
    });

    $("groupModal").addEventListener("click", (event) => {
      if (event.target.id === "groupModal") {
        $("groupModal").classList.add("hidden");
      }
    });
  </script>
</body>
</html>
